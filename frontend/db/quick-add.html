<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#16140f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Quick Add — The Reality Manual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: flex; }
    .qa-gate {
      min-height: 100vh; width: 100%;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .qa-app {
      min-height: 100vh; width: 100%;
      display: flex; flex-direction: column;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    }
    .qa-header { text-align: center; padding-bottom: 14px; }
    .qa-kicker { font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); }
    .qa-title { font-family: var(--font-display); font-weight: 500; font-size: 1.5rem; margin: 4px 0 0; }
    .qa-textarea {
      flex: 1;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 1.15rem;
      line-height: 1.55;
      padding: 16px;
      border-radius: 6px;
      resize: none;
      margin: 10px 0;
    }
    .qa-textarea:focus { outline: none; border-color: var(--accent); }
    .qa-textarea::placeholder { color: var(--ink-faint); font-style: italic; }
    .qa-actions { display: flex; gap: 10px; align-items: center; }
    .qa-save { flex: 1; padding: 16px; font-size: 1.05rem; }
    .qa-toast {
      text-align: center;
      font-size: 0.85rem;
      color: var(--good, #8ea373);
      min-height: 1.4em;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .qa-toast.show { opacity: 1; }
    .qa-links { text-align: center; margin-top: 14px; }
  </style>
</head>
<body>

  <div id="loginGate" class="qa-gate">
    <form id="loginForm" class="login-card" autocomplete="off">
      <div class="login-kicker">The Reality Manual</div>
      <h1 class="login-title">Quick Add</h1>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary btn-block">Enter</button>
      <p class="login-error" id="loginError" hidden>Incorrect password.</p>
    </form>
  </div>

  <div id="qaApp" class="qa-app" hidden>
    <div class="qa-header">
      <div class="qa-kicker">The Reality Manual</div>
      <h1 class="qa-title">New idea</h1>
    </div>
    <textarea id="ideaText" class="qa-textarea" placeholder="What's the idea? Type it or tap the mic on your keyboard to dictate." autofocus></textarea>
    <div class="qa-actions">
      <button type="button" class="btn-primary qa-save" id="saveBtn">Save to Ideation</button>
    </div>
    <div class="qa-toast" id="toast">Saved to Ideation ✓</div>
    <div class="qa-links"><a class="link-btn" href="index.html#content-ops">Open full pipeline →</a></div>
  </div>

  <script src="lib/store.js"></script>
  <script src="lib/auth.js"></script>
  <script>
    (function () {
      'use strict';
      var Store = window.RMStore;
      var Auth = window.RMAuth;

      var loginGate = document.getElementById('loginGate');
      var loginForm = document.getElementById('loginForm');
      var loginPassword = document.getElementById('loginPassword');
      var loginError = document.getElementById('loginError');
      var qaApp = document.getElementById('qaApp');
      var ideaText = document.getElementById('ideaText');
      var saveBtn = document.getElementById('saveBtn');
      var toast = document.getElementById('toast');

      function showApp() {
        loginGate.hidden = true;
        qaApp.hidden = false;
        setTimeout(function () { ideaText.focus(); }, 80);
      }
      function showLogin() {
        qaApp.hidden = true;
        loginGate.hidden = false;
        setTimeout(function () { loginPassword.focus(); }, 50);
      }

      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        if (Auth.checkPassword(loginPassword.value)) {
          Auth.setAuthed(true);
          loginError.hidden = true;
          loginForm.reset();
          showApp();
        } else {
          loginError.hidden = false;
          loginPassword.value = '';
          loginPassword.focus();
        }
      });

      if (Auth.isAuthed()) showApp(); else showLogin();

      function escapeHtml(s) {
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function textToNotesHtml(text) {
        return escapeHtml(text).replace(/\n/g, '<br>');
      }

      var saving = false;
      function saveIdea() {
        var text = ideaText.value.trim();
        if (!text || saving) return;
        saving = true;
        saveBtn.disabled = true;
        var firstLine = text.split('\n')[0].trim();
        var title = firstLine.length > 80 ? firstLine.slice(0, 80).trim() + '…' : firstLine;

        Store.getAll('pieces').then(function (rows) {
          var maxOrder = 0;
          rows.forEach(function (p) {
            if (p.stage === 'ideation' && (p.order || 0) > maxOrder) maxOrder = p.order || 0;
          });
          var id = Store.genId();
          var now = Store.nowIso();
          var piece = {
            id: id, title: title, stage: 'ideation', platforms: [], contentType: 'short',
            notesHtml: textToNotesHtml(text), hasVideo: false,
            order: maxOrder + 10, createdAt: now, updatedAt: now
          };
          return Store.put('pieces', piece);
        }).then(function () {
          ideaText.value = '';
          toast.classList.add('show');
          setTimeout(function () { toast.classList.remove('show'); }, 2200);
          saving = false;
          saveBtn.disabled = false;
          ideaText.focus();
        });
      }

      saveBtn.addEventListener('click', saveIdea);
      ideaText.addEventListener('keydown', function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') saveIdea();
      });
    })();
  </script>
</body>
</html>
