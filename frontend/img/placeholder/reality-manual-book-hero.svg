<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 700" role="img" aria-label="Placeholder — The Reality Manual, standing hardcover">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2318"/>
      <stop offset="0.5" stop-color="#14100a"/>
      <stop offset="1" stop-color="#090705"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3021"/>
      <stop offset="1" stop-color="#17120c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <ellipse cx="270" cy="646" rx="170" ry="26" fill="#000" opacity="0.65" filter="url(#soft)"/>

  <!-- spine -->
  <rect x="96" y="62" width="44" height="562" fill="url(#spine)"/>
  <!-- front board -->
  <rect x="140" y="52" width="300" height="572" fill="url(#cover)"/>
  <rect x="140" y="52" width="300" height="572" fill="none" stroke="#c9a24d" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="158" y="70" width="264" height="536" fill="none" stroke="#c9a24d" stroke-opacity="0.28" stroke-width="1"/>

  <!-- title -->
  <text x="290" y="150" text-anchor="middle" fill="#c9a24d" fill-opacity="0.85"
        font-family="Georgia, 'Times New Roman', serif" font-size="34">The Reality</text>
  <text x="290" y="192" text-anchor="middle" fill="#c9a24d" fill-opacity="0.85"
        font-family="Georgia, 'Times New Roman', serif" font-size="34">Manual</text>

  <!-- emblem -->
  <g stroke="#c9a24d" stroke-opacity="0.62" fill="none" stroke-width="1.4">
    <circle cx="290" cy="370" r="104"/>
    <circle cx="290" cy="370" r="82"/>
    <circle cx="290" cy="370" r="40"/>
    <path d="M186 370 H394 M290 266 V474"/>
    <path d="M217 297 L363 443 M363 297 L217 443" stroke-opacity="0.35"/>
    <path d="M290 266 L330 370 L290 474 L250 370 Z" stroke-opacity="0.5"/>
  </g>
  <circle cx="290" cy="370" r="7" fill="#c9a24d" fill-opacity="0.7"/>

  <text x="290" y="556" text-anchor="middle" fill="#c9a24d" fill-opacity="0.55"
        font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="4">FIRST EDITION</text>
</svg>
