name: Deploy ops-service
on:
  push:
    branches: [main]
    paths:
      - 'ops-service/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and run the redeploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.124.146.235
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /root/realitymanual-repo/ops-service/deploy.sh
