name: Deploy
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/static.yml'

# Only one Pages publication may own the github-pages environment at a time.
# Queue real storefront changes; ops-service/backend-only pushes no longer
# launch a redundant storefront deployment at all.
concurrency:
  group: deploy-storefront-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend
      - id: deployment
        uses: actions/deploy-pages@v4
