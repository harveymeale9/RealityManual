<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reader messages · Content Studio</title>
<style>:root{font:16px system-ui,Arial,sans-serif;color:#e8eee8;background:#07100c}*{box-sizing:border-box}body{margin:0;padding:30px clamp(18px,5vw,80px)}a{color:#6bf2ad}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font:500 clamp(2rem,5vw,3.5rem) Georgia,serif;margin:40px 0 9px}p{line-height:1.55;color:#a9bbaf}.list{display:grid;gap:15px;margin:32px 0}.card{background:#102017;border:1px solid #265740;border-radius:15px;padding:22px}.card.unread{border-color:#62db9f}.card h2{margin:0 0 12px;font-size:1.2rem}.meta{color:#99b6a4;font-size:.83rem}.message{white-space:pre-wrap;color:#e8eee8}.files{display:flex;flex-wrap:wrap;gap:10px}.files a,button{display:inline-block;padding:10px 14px;border:1px solid #69cd98;border-radius:8px;text-decoration:none;background:transparent;color:#d2f6dc;cursor:pointer}.badge{color:#ffcf7f;font-weight:700}.error{color:#ffbba9}</style></head><body>
<header><a href="/">← Content Studio</a><span>PRIVATE READER MESSAGES</span></header>
<h1>Feedback &amp; reviews</h1><p>New feedback, reviews and video reviews. They also appear in Mailbox; no automatic reply is sent.</p>
<p id="status" role="status">Loading submissions…</p><div id="list" class="list"></div>
<script>
(async function () {
  const status = document.getElementById('status');
  const list = document.getElementById('list');
  try {
    const response = await fetch('/api/customer-submissions-admin/', { credentials: 'same-origin' });
    if (response.status === 401) { status.innerHTML = 'Please <a href="/">sign in to Content Studio</a> first.'; return; }
    if (!response.ok) throw Error('Unable to load messages.');
    const { submissions } = await response.json();
    status.textContent = submissions.length ? submissions.length + ' submission' + (submissions.length === 1 ? '' : 's') : 'No submissions yet.';
    for (const item of submissions) {
      const card = document.createElement('article');
      card.className = 'card' + (item.seenAt ? '' : ' unread');
      const type = item.kind === 'feedback' ? 'Feedback' : item.files.some(file => file.kind === 'video') ? 'Video review' : 'Review';
      const title = document.createElement('h2'); title.textContent = type + ' from ' + item.name;
      const meta = document.createElement('p'); meta.className = 'meta'; meta.textContent = new Date(item.submittedAt).toLocaleString() + ' · ' + item.email;
      const body = document.createElement('p'); body.className = 'message'; body.textContent = item.message;
      card.append(title, meta, body);
      if (item.paidVideo) { const paid = document.createElement('p'); paid.className = 'badge'; paid.textContent = '$50 video consideration requested — verify eligibility and contact them for payment details.'; card.append(paid); }
      if (item.kind === 'feedback' && item.voucherReview) {
        const voucher = document.createElement('p'); voucher.className = 'meta';
        voucher.textContent = 'Voucher review: ' + item.voucherReview.status.replaceAll('_', ' ') + (item.voucherReview.reason ? ' · ' + item.voucherReview.reason : '');
        card.append(voucher);
      }
      if (item.files.length) {
        const files = document.createElement('div'); files.className = 'files';
        for (const file of item.files) {
          const link = document.createElement('a');
          link.href = '/api/customer-submissions-admin/' + encodeURIComponent(item.id) + '/files/' + encodeURIComponent(file.id);
          link.target = '_blank'; link.rel = 'noopener';
          link.textContent = (file.kind === 'video' ? 'Video: ' : 'Image: ') + file.name;
          files.append(link);
        }
        card.append(files);
      }
      if (!item.seenAt) {
        const seen = document.createElement('button'); seen.type = 'button'; seen.textContent = 'Mark read';
        seen.addEventListener('click', async () => {
          seen.disabled = true;
          const saved = await fetch('/api/customer-submissions-admin/' + encodeURIComponent(item.id) + '/seen', { method: 'POST', credentials: 'same-origin' });
          if (saved.ok) { card.classList.remove('unread'); seen.remove(); }
          else { seen.disabled = false; status.textContent = 'Could not mark read. Try again.'; }
        });
        card.append(seen);
      }
      list.append(card);
    }
  } catch (error) { status.textContent = error.message; status.className = 'error'; }
})();
</script></body></html>
