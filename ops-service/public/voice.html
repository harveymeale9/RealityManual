<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Talk to CC — The Reality Manual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: flex; }
    .cc-app { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }
    .cc-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px; border-bottom: 1px solid var(--border-soft);
    }
    .cc-header-left { display: flex; align-items: center; gap: 12px; }
    .cc-back { color: var(--ink-faint); text-decoration: none; font-size: 0.85rem; }
    .cc-back:hover { color: var(--accent); }
    .cc-title { font-family: var(--font-display); font-size: 1.15rem; margin: 0; }
    .cc-header-right { display: flex; align-items: center; gap: 10px; }
    .cc-reset-btn {
      background: none; border: 1px solid var(--border); color: var(--ink-soft);
      border-radius: 6px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer;
    }
    .cc-reset-btn:hover { border-color: var(--accent); color: var(--accent); }

    .cc-body { flex: 1; display: flex; flex-direction: column; max-width: 780px; width: 100%; margin: 0 auto; padding: 0 18px; min-height: 0; }
    .cc-thread { flex: 1; overflow-y: auto; padding: 22px 4px; display: flex; flex-direction: column; gap: 16px; }
    .cc-empty { color: var(--ink-faint); text-align: center; margin-top: 60px; font-size: 0.95rem; }

    .cc-msg { max-width: 82%; padding: 12px 15px; border-radius: 10px; line-height: 1.55; font-size: 0.95rem; white-space: pre-wrap; }
    .cc-msg-user { align-self: flex-end; background: var(--accent-soft); border: 1px solid var(--accent-soft-strong); color: var(--ink); }
    .cc-msg-assistant { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); color: var(--ink); }
    .cc-msg-system { align-self: center; color: var(--ink-faint); font-size: 0.82rem; background: none; border: none; padding: 4px; }
    .cc-msg-error { align-self: flex-start; background: var(--error-soft); border: 1px solid var(--error); color: var(--ink); }
    .cc-msg-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .cc-msg-tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); }
    .cc-play-btn {
      background: none; border: 1px solid var(--border); color: var(--accent);
      border-radius: 6px; padding: 3px 9px; font-size: 0.75rem; cursor: pointer;
    }
    .cc-play-btn:hover { border-color: var(--accent); }
    .cc-typing { align-self: flex-start; color: var(--ink-faint); font-size: 0.85rem; font-style: italic; }

    .cc-inputbar { border-top: 1px solid var(--border-soft); padding: 14px 4px 20px; }
    .cc-execute-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .cc-execute-row label { font-size: 0.82rem; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .cc-input-row { display: flex; align-items: flex-end; gap: 10px; }
    .cc-textarea {
      flex: 1; resize: none; background: var(--surface); border: 1px solid var(--border);
      color: var(--ink); font-family: var(--font-body); font-size: 0.95rem; line-height: 1.5;
      padding: 12px 14px; border-radius: 8px; max-height: 160px;
    }
    .cc-textarea:focus { outline: none; border-color: var(--accent); }
    .cc-mic-btn, .cc-send-btn {
      width: 46px; height: 46px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--ink-soft); display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }
    .cc-mic-btn.recording { background: var(--error-soft); border-color: var(--error); color: var(--error); animation: cc-rec-pulse 1.2s ease-in-out infinite; }
    @keyframes cc-rec-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    .cc-send-btn {
      background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 55%, var(--accent-3) 100%);
      color: var(--accent-ink); border: none;
    }
    .cc-send-btn:disabled { opacity: 0.5; cursor: default; }
    .cc-hint { color: var(--ink-faint); font-size: 0.72rem; margin-top: 8px; }
  </style>
</head>
<body>

  <div id="authChecking" class="auth-checking"><div class="spinner" aria-hidden="true"></div></div>

  <div id="loginGate" class="login-gate" hidden>
    <form id="loginForm" class="login-card" autocomplete="off">
      <div class="login-kicker">The Reality Manual</div>
      <h1 class="login-title">Talk to CC</h1>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary btn-block">Enter</button>
      <p class="login-error" id="loginError" hidden>Incorrect password.</p>
    </form>
  </div>

  <div id="ccApp" class="cc-app" hidden>
    <header class="cc-header">
      <div class="cc-header-left">
        <a class="cc-back" href="index.html">&larr; Control Panel</a>
        <h1 class="cc-title">Talk to CC</h1>
      </div>
      <div class="cc-header-right">
        <a class="cc-back" href="voice-mobile.html">Mobile view</a>
        <button type="button" class="cc-reset-btn" id="resetBtn">New conversation</button>
      </div>
    </header>
    <div class="cc-body">
      <div class="cc-thread" id="thread">
        <div class="cc-empty">Type or speak to Claude Code — same project, same tools, full memory of RealityManual.</div>
      </div>
      <div class="cc-inputbar">
        <div class="cc-execute-row">
          <label><input type="checkbox" id="executeOnly" /> Execute only — don't wait for a reply</label>
        </div>
        <div class="cc-input-row">
          <button type="button" class="cc-mic-btn" id="micBtn" title="Record voice message" aria-label="Record voice message">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
          </button>
          <textarea id="textInput" class="cc-textarea" rows="1" placeholder="Message Claude Code…"></textarea>
          <button type="button" class="cc-send-btn" id="sendBtn" title="Send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg>
          </button>
        </div>
        <div class="cc-hint">Voice replies are spoken automatically. Typed replies show as text — tap ▶ to hear one.</div>
      </div>
    </div>
  </div>

  <script src="lib/store.js"></script>
  <script src="lib/auth.js"></script>
  <script src="lib/voiceClient.js"></script>
  <script>
    (function () {
      'use strict';
      var Auth = window.RMAuth;
      var Voice = window.RMVoice;

      var authChecking = document.getElementById('authChecking');
      var loginGate = document.getElementById('loginGate');
      var loginForm = document.getElementById('loginForm');
      var loginPassword = document.getElementById('loginPassword');
      var loginError = document.getElementById('loginError');
      var ccApp = document.getElementById('ccApp');
      var thread = document.getElementById('thread');
      var textInput = document.getElementById('textInput');
      var sendBtn = document.getElementById('sendBtn');
      var micBtn = document.getElementById('micBtn');
      var executeOnly = document.getElementById('executeOnly');
      var resetBtn = document.getElementById('resetBtn');

      function showApp() { authChecking.hidden = true; loginGate.hidden = true; ccApp.hidden = false; textInput.focus(); }
      function showLogin() { authChecking.hidden = true; ccApp.hidden = true; loginGate.hidden = false; setTimeout(function () { loginPassword.focus(); }, 50); }

      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        Auth.checkPassword(loginPassword.value).then(function (ok) {
          if (ok) { loginError.hidden = true; loginForm.reset(); showApp(); }
          else { loginError.hidden = false; loginPassword.value = ''; loginPassword.focus(); }
        });
      });
      Auth.checkSession().then(function (ok) { if (ok) showApp(); else showLogin(); });

      var emptyNote = thread.querySelector('.cc-empty');
      function clearEmptyNote() { if (emptyNote && emptyNote.parentNode) { emptyNote.parentNode.removeChild(emptyNote); emptyNote = null; } }

      function addMessage(kind, text) {
        clearEmptyNote();
        var el = document.createElement('div');
        el.className = 'cc-msg cc-msg-' + kind;
        el.textContent = text;
        thread.appendChild(el);
        thread.scrollTop = thread.scrollHeight;
        return el;
      }

      function addAssistantMessage(text) {
        clearEmptyNote();
        var wrap = document.createElement('div');
        wrap.className = 'cc-msg cc-msg-assistant';
        var body = document.createElement('div');
        body.textContent = text;
        wrap.appendChild(body);
        var meta = document.createElement('div');
        meta.className = 'cc-msg-meta';
        var playBtn = document.createElement('button');
        playBtn.type = 'button';
        playBtn.className = 'cc-play-btn';
        playBtn.textContent = '▶ Play';
        playBtn.addEventListener('click', function () { Voice.speak(text).catch(function () {}); });
        meta.appendChild(playBtn);
        wrap.appendChild(meta);
        thread.appendChild(wrap);
        thread.scrollTop = thread.scrollHeight;
        return wrap;
      }

      function addTyping() {
        clearEmptyNote();
        var el = document.createElement('div');
        el.className = 'cc-typing';
        el.textContent = 'CC is working on it…';
        thread.appendChild(el);
        thread.scrollTop = thread.scrollHeight;
        return el;
      }

      function sendText(text, mode, opts) {
        opts = opts || {};
        var autoSpeak = !!opts.autoSpeak;
        if (!text.trim()) return;
        addMessage('user', text);
        var typingEl = addTyping();
        Voice.sendMessage(text.trim(), mode).then(function (created) {
          if (mode === 'execute') {
            typingEl.textContent = 'Instruction sent — no reply expected.';
            return null;
          }
          return Voice.pollMessage(created.id);
        }).then(function (row) {
          if (typingEl.parentNode) typingEl.parentNode.removeChild(typingEl);
          if (!row) return;
          if (row.status === 'error') {
            addMessage('error', row.error_message || 'Something went wrong.');
            return;
          }
          addAssistantMessage(row.reply_text || '');
          if (autoSpeak) Voice.speak(row.reply_text || '').catch(function () {});
        }).catch(function (err) {
          if (typingEl.parentNode) typingEl.parentNode.removeChild(typingEl);
          addMessage('error', (err && err.message) || 'Something went wrong.');
        });
      }

      function currentMode() { return executeOnly.checked ? 'execute' : 'respond'; }

      sendBtn.addEventListener('click', function () {
        var text = textInput.value;
        textInput.value = '';
        textInput.style.height = 'auto';
        sendText(text, currentMode(), { autoSpeak: false });
      });
      textInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendBtn.click();
        }
      });
      textInput.addEventListener('input', function () {
        textInput.style.height = 'auto';
        textInput.style.height = Math.min(textInput.scrollHeight, 160) + 'px';
      });

      var activeRecorder = null;
      micBtn.addEventListener('click', function () {
        if (activeRecorder) {
          var rec = activeRecorder;
          activeRecorder = null;
          micBtn.classList.remove('recording');
          rec.stop().then(function (blob) { return Voice.transcribe(blob); })
            .then(function (text) {
              if (!text) return;
              sendText(text, currentMode(), { autoSpeak: true });
            })
            .catch(function (err) { addMessage('error', (err && err.message) || 'Could not transcribe audio.'); });
          return;
        }
        Voice.startRecording().then(function (rec) {
          activeRecorder = rec;
          micBtn.classList.add('recording');
        }).catch(function () {
          alert('Could not access the microphone. Check the browser has mic permission.');
        });
      });

      resetBtn.addEventListener('click', function () {
        if (!confirm('Start a new conversation? CC will lose context from this one.')) return;
        Voice.resetSession().then(function () {
          addMessage('system', 'New conversation started.');
        });
      });
    })();
  </script>
</body>
</html>
