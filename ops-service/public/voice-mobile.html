<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#04170c" />
  <link rel="manifest" href="voice-manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Project Manager — The Reality Manual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; }
    .v-app {
      width: 100%; height: 100dvh;
      display: flex; flex-direction: column; min-height: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .v-home { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px; min-height: 0; }

    /* Compact top/bottom action buttons — fixed height (not flex:1, which
       used to split the whole screen in half between them and pushed the
       bottom one past the safe area on some phones), with the chat thread
       taking whatever's left. min-height doubled to 128px per Harvey. */
    .v-btn {
      flex-shrink: 0; border: none; border-radius: 14px; min-height: 128px;
      display: flex; align-items: center; justify-content: center; gap: 14px; padding: 10px 18px;
      font-family: var(--font-body); font-weight: 600; letter-spacing: 0.01em;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .v-btn svg { width: 34px; height: 34px; flex-shrink: 0; }
    .v-btn .v-btn-text { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    .v-btn .v-btn-label { font-size: 1.2rem; }
    .v-btn .v-btn-sub { font-size: 0.82rem; font-weight: 400; opacity: 0.85; text-align: left; }
    .v-btn-ask {
      color: var(--accent-ink);
      background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 55%, var(--accent-3) 100%);
    }
    .v-btn-execute {
      color: var(--ink);
      background: var(--surface-2);
      border: 1.5px solid var(--error);
    }
    .v-btn-execute svg { stroke: var(--error); }
    .v-btn:active { transform: scale(0.98); }

    /* The always-visible chat, sandwiched between the two buttons — no more
       history hidden behind a separate icon/overlay. */
    .v-chat { flex: 1; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--border-soft); border-radius: 14px; overflow: hidden; }
    .v-chat .pm-thread { padding: 14px; max-width: none; }
    .v-chat .pm-inputbar { max-width: none; padding: 10px; }

    .v-overlay {
      position: fixed; inset: 0; z-index: 20; background: var(--ivory);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 24px; text-align: center;
    }
    .v-pulse {
      width: 90px; height: 90px; border-radius: 50%;
      background: var(--accent-soft); display: flex; align-items: center; justify-content: center;
      animation: v-pulse 1.4s ease-in-out infinite;
    }
    .v-pulse.execute { background: var(--error-soft); }
    .v-pulse svg { width: 42px; height: 42px; color: var(--accent); }
    .v-pulse.execute svg { color: var(--error); }
    @keyframes v-pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft-strong); }
      50% { box-shadow: 0 0 0 22px rgba(0,0,0,0); }
    }
    .v-status { font-family: var(--font-display); font-size: 1.3rem; color: var(--ink); }
    .v-status-sub { color: var(--ink-faint); font-size: 0.9rem; max-width: 320px; }
    .v-overlay .btn-secondary {
      padding: 14px 26px; border-radius: 8px; font-size: 1rem; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--ink); cursor: pointer;
    }
    .v-finish-btn {
      padding: 16px 34px; border-radius: 999px; font-size: 1.05rem; font-weight: 600;
      background: var(--error); color: #fff; border: none; cursor: pointer;
    }

  </style>
</head>
<body>

  <div id="authChecking" class="auth-checking"><div class="spinner" aria-hidden="true"></div></div>

  <div id="loginGate" class="login-gate" hidden>
    <form id="loginForm" class="login-card" autocomplete="off">
      <div class="login-kicker">The Reality Manual</div>
      <h1 class="login-title">Project Manager</h1>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary btn-block">Enter</button>
      <p class="login-error" id="loginError" hidden>Incorrect password.</p>
    </form>
  </div>

  <div id="vApp" class="v-app" hidden>
    <div class="v-home">
      <button type="button" class="v-btn v-btn-ask" id="askBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
        <span class="v-btn-text"><span class="v-btn-label">Ask &amp; Wait for Reply</span><span class="v-btn-sub">Speak — hear CC's answer back</span></span>
      </button>

      <div class="v-chat">
        <div class="pm-thread" id="vThread">
          <div class="pm-empty">Type or speak to Claude Code — same project, same tools, full memory of RealityManual.</div>
        </div>
        <div class="pm-inputbar">
          <div class="pm-input-row">
            <textarea id="vTextInput" class="pm-textarea" rows="1" placeholder="Can't speak? Type here…"></textarea>
            <button type="button" class="pm-send-btn" id="vSendBtn" title="Send" aria-label="Send">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <button type="button" class="v-btn v-btn-execute" id="executeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
        <span class="v-btn-text"><span class="v-btn-label">Just Execute</span><span class="v-btn-sub">Speak — text reply only, not read aloud</span></span>
      </button>
    </div>
  </div>

  <div id="recordOverlay" class="v-overlay" hidden>
    <div class="v-pulse" id="recordPulse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
    </div>
    <div class="v-status" id="recordStatus">Listening…</div>
    <button type="button" class="v-finish-btn" id="finishBtn">Finish Recording</button>
    <button type="button" class="btn-secondary" id="cancelRecordBtn" style="background:none;border:none;color:var(--ink-faint);">Cancel</button>
  </div>

  <div id="waitOverlay" class="v-overlay" hidden>
    <div class="v-status" id="waitStatus">Transcribing…</div>
    <div class="v-status-sub" id="waitSub"></div>
  </div>

  <script src="lib/store.js"></script>
  <script src="lib/auth.js"></script>
  <script src="lib/voiceClient.js"></script>
  <script>
    (function () {
      'use strict';
      var Auth = window.RMAuth;
      var Voice = window.RMVoice;

      var authChecking = document.getElementById('authChecking');
      var loginGate = document.getElementById('loginGate');
      var loginForm = document.getElementById('loginForm');
      var loginPassword = document.getElementById('loginPassword');
      var loginError = document.getElementById('loginError');
      var vApp = document.getElementById('vApp');

      var askBtn = document.getElementById('askBtn');
      var executeBtn = document.getElementById('executeBtn');
      var recordOverlay = document.getElementById('recordOverlay');
      var recordPulse = document.getElementById('recordPulse');
      var recordStatus = document.getElementById('recordStatus');
      var finishBtn = document.getElementById('finishBtn');
      var cancelRecordBtn = document.getElementById('cancelRecordBtn');
      var waitOverlay = document.getElementById('waitOverlay');
      var waitStatus = document.getElementById('waitStatus');
      var waitSub = document.getElementById('waitSub');

      var thread = document.getElementById('vThread');
      var textInput = document.getElementById('vTextInput');
      var sendBtn = document.getElementById('vSendBtn');

      function showApp() {
        authChecking.hidden = true; loginGate.hidden = true; vApp.hidden = false;
        startSync();
      }
      function showLogin() { authChecking.hidden = true; vApp.hidden = true; loginGate.hidden = false; setTimeout(function () { loginPassword.focus(); }, 50); }

      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        Auth.checkPassword(loginPassword.value).then(function (ok) {
          if (ok) { loginError.hidden = true; loginForm.reset(); showApp(); }
          else { loginError.hidden = false; loginPassword.value = ''; loginPassword.focus(); }
        });
      });
      Auth.checkSession().then(function (ok) { if (ok) showApp(); else showLogin(); });

      // --- Always-visible thread, shared by the voice buttons below and the
      // type bar — no more history hidden behind a separate icon/overlay
      // (see CLAUDE.md for why: it was invisible and easy to forget existed).
      var emptyNote = thread.querySelector('.pm-empty');
      function clearEmptyNote() { if (emptyNote && emptyNote.parentNode) { emptyNote.parentNode.removeChild(emptyNote); emptyNote = null; } }

      function addMessage(kind, text, msgId) {
        clearEmptyNote();
        var el = document.createElement('div');
        el.className = 'pm-msg pm-msg-' + kind;
        if (msgId) el.dataset.msgId = msgId;
        el.textContent = text;
        thread.appendChild(el);
        thread.scrollTop = thread.scrollHeight;
        return el;
      }

      function addAssistantMessage(text) {
        clearEmptyNote();
        var wrap = document.createElement('div');
        wrap.className = 'pm-msg pm-msg-assistant';
        var body = document.createElement('div');
        body.textContent = text;
        wrap.appendChild(body);
        var meta = document.createElement('div');
        meta.className = 'pm-msg-meta';
        var playBtn = document.createElement('button');
        playBtn.type = 'button';
        playBtn.className = 'pm-play-btn';
        playBtn.textContent = '▶ Play';
        playBtn.addEventListener('click', function () { Voice.speak(text).catch(function () {}); });
        meta.appendChild(playBtn);
        wrap.appendChild(meta);
        thread.appendChild(wrap);
        thread.scrollTop = thread.scrollHeight;
        return wrap;
      }

      function addTyping(msgId) {
        clearEmptyNote();
        var el = document.createElement('div');
        el.className = 'pm-typing';
        if (msgId) el.dataset.msgId = msgId;
        el.textContent = 'CC is working on it…';
        thread.appendChild(el);
        thread.scrollTop = thread.scrollHeight;
        return el;
      }

      function removeTyping(msgId) {
        var el = thread.querySelector('.pm-typing[data-msg-id="' + msgId + '"]');
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }

      // Ids this device itself sent by voice and wants spoken aloud once the
      // reply lands — never applied to a reply that shows up because it was
      // sent from the desktop panel instead.
      var autoSpeakIds = {};

      // Same shared engine the desktop Project Manager tab uses (see
      // lib/voiceClient.js): first tick loads whatever's already in the
      // table (so opening the app resumes the last conversation instead of
      // a blank slate), every tick after picks up anything new — including
      // messages sent from the desktop panel while this app just sits open.
      // Started from showApp() (not eagerly here) so it never polls the
      // authenticated messages endpoint before login is confirmed.
      var sync = null;
      function startSync() {
        if (sync) return;
        sync = Voice.syncThread({
          onNewMessage: function (row) { addMessage('user', row.transcript, row.id); },
          onPending: function (row) { addTyping(row.id); },
          onDone: function (row) {
            removeTyping(row.id);
            // Execute-mode replies are a real completion summary now (see
            // server.js buildVoicePrompt), not a throwaway line — show it
            // like any other reply instead of a generic "Done" placeholder.
            addAssistantMessage(row.reply_text || '');
            if (autoSpeakIds[row.id]) { delete autoSpeakIds[row.id]; Voice.speak(row.reply_text || '').catch(function () {}); }
          },
          onError: function (row) {
            removeTyping(row.id);
            addMessage('error', row.error_message || 'Something went wrong.');
          }
        });
      }

      // --- Type bar: the "can't speak" fallback, always sends respond mode ---
      function sendTyped(text) {
        if (!text.trim()) return;
        addMessage('user', text);
        var typingEl = addTyping();
        Voice.sendMessage(text.trim(), 'respond').then(function (created) {
          typingEl.dataset.msgId = created.id;
          sync.markKnown(created);
        }).catch(function (err) {
          if (typingEl.parentNode) typingEl.parentNode.removeChild(typingEl);
          addMessage('error', (err && err.message) || 'Something went wrong.');
        });
      }
      sendBtn.addEventListener('click', function () {
        var text = textInput.value;
        textInput.value = '';
        textInput.style.height = 'auto';
        sendTyped(text);
      });
      textInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
      });
      textInput.addEventListener('input', function () {
        textInput.style.height = 'auto';
        textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
      });

      // --- Voice buttons: unchanged record/transcribe/send mechanics, now
      // also mirrored into the persistent thread above so it reflects every
      // interaction regardless of which entry point was used. ---
      function hideAllOverlays() {
        recordOverlay.hidden = true;
        waitOverlay.hidden = true;
      }

      var activeRecorder = null;

      function startFlow(mode) {
        recordPulse.className = 'v-pulse' + (mode === 'execute' ? ' execute' : '');
        recordStatus.textContent = 'Listening…';
        hideAllOverlays();
        recordOverlay.hidden = false;
        Voice.startRecording().then(function (rec) {
          activeRecorder = rec;
        }).catch(function () {
          hideAllOverlays();
          alert('Could not access the microphone. Check the browser has mic permission.');
        });

        function cleanup() {
          activeRecorder = null;
          finishBtn.onclick = null;
          cancelRecordBtn.onclick = null;
        }

        cancelRecordBtn.onclick = function () {
          if (activeRecorder) activeRecorder.stop();
          cleanup();
          hideAllOverlays();
        };

        finishBtn.onclick = function () {
          if (!activeRecorder) return;
          var rec = activeRecorder;
          cleanup();
          hideAllOverlays();
          waitStatus.textContent = 'Transcribing…';
          waitSub.textContent = '';
          waitOverlay.hidden = false;
          rec.stop().then(function (blob) {
            return Voice.transcribe(blob);
          }).then(function (text) {
            if (!text) throw new Error('empty_transcript');
            waitSub.textContent = '"' + text + '"';
            waitStatus.textContent = mode === 'execute' ? 'Sending instruction…' : 'Awaiting response from CC…';
            addMessage('user', text);
            var typingEl = mode === 'execute' ? null : addTyping();
            return Voice.sendMessage(text, mode).then(function (created) {
              // Mark it known on the shared sync engine right away so its
              // next tick doesn't treat this same row as new (duplicate user
              // bubble/typing indicator) once it catches up to it.
              if (typingEl) typingEl.dataset.msgId = created.id;
              sync.markKnown(created);
              if (mode === 'execute') {
                setTimeout(function () {
                  hideAllOverlays();
                }, 1200);
                waitStatus.textContent = 'Got it — working on it.';
                // Fire-and-forget by design — don't wait for real completion.
                // The shared sync engine's onDone will render "Done — no
                // reply expected." into the thread whenever this message
                // genuinely finishes server-side, same as if another device
                // had sent it.
                return null;
              }
              return Voice.pollMessage(created.id).then(function (row) {
                if (typingEl && typingEl.parentNode) typingEl.parentNode.removeChild(typingEl);
                // Terminal status now known locally — tell the shared engine
                // so its later tick doesn't also render this same reply.
                sync.markKnown(row);
                return row;
              });
            });
          }).then(function (row) {
            // No result popup — the reply already lands in the thread
            // (addAssistantMessage/addMessage below) and is spoken aloud,
            // so a second on-screen copy would just be redundant per Harvey.
            hideAllOverlays();
            if (!row) return;
            if (row.status === 'error') {
              addMessage('error', row.error_message || 'Something went wrong.');
              return;
            }
            addAssistantMessage(row.reply_text || '');
            Voice.speak(row.reply_text || '').catch(function () {});
          }).catch(function (err) {
            hideAllOverlays();
            addMessage('error', (err && err.message) || 'Something went wrong.');
          });
        };
      }

      askBtn.addEventListener('click', function () { startFlow('respond'); });
      executeBtn.addEventListener('click', function () { startFlow('execute'); });
    })();
  </script>
</body>
</html>
