<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#04170c" />
  <link rel="manifest" href="voice-manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Talk to CC — The Reality Manual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; }
    .v-app {
      width: 100%; min-height: 100dvh;
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .v-home { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 10px; position: relative; }
    .v-btn {
      flex: 1; border: none; border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      font-family: var(--font-body); font-weight: 600; letter-spacing: 0.01em;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .v-btn svg { width: 40px; height: 40px; }
    .v-btn .v-btn-label { font-size: 1.3rem; }
    .v-btn .v-btn-sub { font-size: 0.8rem; font-weight: 400; opacity: 0.85; max-width: 70%; text-align: center; }
    .v-btn-ask {
      color: var(--accent-ink);
      background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 55%, var(--accent-3) 100%);
    }
    .v-btn-execute {
      color: var(--ink);
      background: var(--surface-2);
      border: 1.5px solid var(--error);
    }
    .v-btn-execute svg { stroke: var(--error); }
    .v-btn:active { transform: scale(0.98); }

    .v-history-btn {
      position: absolute; top: 6px; right: 6px; z-index: 5;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--ink-soft); display: flex; align-items: center; justify-content: center;
    }

    .v-overlay {
      position: fixed; inset: 0; z-index: 20; background: var(--ivory);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 24px; text-align: center;
    }
    .v-pulse {
      width: 90px; height: 90px; border-radius: 50%;
      background: var(--accent-soft); display: flex; align-items: center; justify-content: center;
      animation: v-pulse 1.4s ease-in-out infinite;
    }
    .v-pulse.execute { background: var(--error-soft); }
    .v-pulse svg { width: 42px; height: 42px; color: var(--accent); }
    .v-pulse.execute svg { color: var(--error); }
    @keyframes v-pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft-strong); }
      50% { box-shadow: 0 0 0 22px rgba(0,0,0,0); }
    }
    .v-status { font-family: var(--font-display); font-size: 1.3rem; color: var(--ink); }
    .v-status-sub { color: var(--ink-faint); font-size: 0.9rem; max-width: 320px; }
    .v-reply-text {
      color: var(--ink); font-size: 1.05rem; line-height: 1.6; max-width: 480px;
      max-height: 40vh; overflow-y: auto; padding: 4px 6px;
    }
    .v-overlay .btn-primary, .v-overlay .btn-secondary {
      padding: 14px 26px; border-radius: 8px; font-size: 1rem; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--ink); cursor: pointer;
    }
    .v-overlay .btn-primary {
      background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 55%, var(--accent-3) 100%);
      color: var(--accent-ink); border: none; font-weight: 600;
    }
    .v-finish-btn {
      padding: 16px 34px; border-radius: 999px; font-size: 1.05rem; font-weight: 600;
      background: var(--error); color: #fff; border: none; cursor: pointer;
    }

    .v-history-panel {
      position: fixed; inset: 0; z-index: 30; background: var(--ivory);
      display: flex; flex-direction: column; padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
    }
    .v-history-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 4px; }
    .v-history-header h1 { font-family: var(--font-display); font-size: 1.2rem; margin: 0; }
    .v-history-close { background: none; border: none; color: var(--ink-soft); font-size: 1.4rem; cursor: pointer; padding: 6px 10px; }
    .v-history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px; }
    .v-history-item { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--surface); }
    .v-history-item .v-hi-mode { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 4px; }
    .v-history-item.v-hi-execute .v-hi-mode { color: var(--error); }
    .v-history-item .v-hi-you { color: var(--ink); font-size: 0.95rem; margin-bottom: 6px; }
    .v-history-item .v-hi-reply { color: var(--ink-soft); font-size: 0.9rem; white-space: pre-wrap; }
    .v-history-item .v-hi-time { color: var(--ink-faint); font-size: 0.72rem; margin-top: 6px; }
    .v-hi-play { margin-top: 8px; background: none; border: 1px solid var(--border); color: var(--accent); border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer; }
  </style>
</head>
<body>

  <div id="authChecking" class="auth-checking"><div class="spinner" aria-hidden="true"></div></div>

  <div id="loginGate" class="login-gate" hidden>
    <form id="loginForm" class="login-card" autocomplete="off">
      <div class="login-kicker">The Reality Manual</div>
      <h1 class="login-title">Talk to CC</h1>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary btn-block">Enter</button>
      <p class="login-error" id="loginError" hidden>Incorrect password.</p>
    </form>
  </div>

  <div id="vApp" class="v-app" hidden>
    <div class="v-home">
      <button type="button" class="v-history-btn" id="historyBtn" aria-label="History">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </button>
      <button type="button" class="v-btn v-btn-ask" id="askBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
        <span class="v-btn-label">Ask &amp; Wait for Reply</span>
        <span class="v-btn-sub">Speak a question — hear CC's answer back</span>
      </button>
      <button type="button" class="v-btn v-btn-execute" id="executeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
        <span class="v-btn-label">Just Execute</span>
        <span class="v-btn-sub">Speak an instruction — no reply needed</span>
      </button>
    </div>
  </div>

  <div id="recordOverlay" class="v-overlay" hidden>
    <div class="v-pulse" id="recordPulse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
    </div>
    <div class="v-status" id="recordStatus">Listening…</div>
    <button type="button" class="v-finish-btn" id="finishBtn">Finish Recording</button>
    <button type="button" class="btn-secondary" id="cancelRecordBtn" style="background:none;border:none;color:var(--ink-faint);">Cancel</button>
  </div>

  <div id="waitOverlay" class="v-overlay" hidden>
    <div class="v-status" id="waitStatus">Transcribing…</div>
    <div class="v-status-sub" id="waitSub"></div>
  </div>

  <div id="resultOverlay" class="v-overlay" hidden>
    <div class="v-status" id="resultStatus">CC replied</div>
    <div class="v-reply-text" id="resultText"></div>
    <button type="button" class="btn-primary" id="resultDoneBtn">Done</button>
  </div>

  <div id="historyPanel" class="v-history-panel" hidden>
    <div class="v-history-header">
      <h1>Recent messages</h1>
      <button type="button" class="v-history-close" id="historyCloseBtn">&times;</button>
    </div>
    <div class="v-history-list" id="historyList"></div>
  </div>

  <script src="lib/store.js"></script>
  <script src="lib/auth.js"></script>
  <script src="lib/voiceClient.js"></script>
  <script>
    (function () {
      'use strict';
      var Auth = window.RMAuth;
      var Voice = window.RMVoice;

      var authChecking = document.getElementById('authChecking');
      var loginGate = document.getElementById('loginGate');
      var loginForm = document.getElementById('loginForm');
      var loginPassword = document.getElementById('loginPassword');
      var loginError = document.getElementById('loginError');
      var vApp = document.getElementById('vApp');

      var askBtn = document.getElementById('askBtn');
      var executeBtn = document.getElementById('executeBtn');
      var recordOverlay = document.getElementById('recordOverlay');
      var recordPulse = document.getElementById('recordPulse');
      var recordStatus = document.getElementById('recordStatus');
      var finishBtn = document.getElementById('finishBtn');
      var cancelRecordBtn = document.getElementById('cancelRecordBtn');
      var waitOverlay = document.getElementById('waitOverlay');
      var waitStatus = document.getElementById('waitStatus');
      var waitSub = document.getElementById('waitSub');
      var resultOverlay = document.getElementById('resultOverlay');
      var resultStatus = document.getElementById('resultStatus');
      var resultText = document.getElementById('resultText');
      var resultDoneBtn = document.getElementById('resultDoneBtn');
      var historyBtn = document.getElementById('historyBtn');
      var historyPanel = document.getElementById('historyPanel');
      var historyCloseBtn = document.getElementById('historyCloseBtn');
      var historyList = document.getElementById('historyList');

      function showApp() { authChecking.hidden = true; loginGate.hidden = true; vApp.hidden = false; }
      function showLogin() { authChecking.hidden = true; vApp.hidden = true; loginGate.hidden = false; setTimeout(function () { loginPassword.focus(); }, 50); }

      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        Auth.checkPassword(loginPassword.value).then(function (ok) {
          if (ok) { loginError.hidden = true; loginForm.reset(); showApp(); }
          else { loginError.hidden = false; loginPassword.value = ''; loginPassword.focus(); }
        });
      });
      Auth.checkSession().then(function (ok) { if (ok) showApp(); else showLogin(); });

      function hideAllOverlays() {
        recordOverlay.hidden = true;
        waitOverlay.hidden = true;
        resultOverlay.hidden = true;
      }

      var activeRecorder = null;

      function startFlow(mode) {
        recordPulse.className = 'v-pulse' + (mode === 'execute' ? ' execute' : '');
        recordStatus.textContent = 'Listening…';
        hideAllOverlays();
        recordOverlay.hidden = false;
        Voice.startRecording().then(function (rec) {
          activeRecorder = rec;
        }).catch(function () {
          hideAllOverlays();
          alert('Could not access the microphone. Check the browser has mic permission.');
        });

        function cleanup() {
          activeRecorder = null;
          finishBtn.onclick = null;
          cancelRecordBtn.onclick = null;
        }

        cancelRecordBtn.onclick = function () {
          if (activeRecorder) activeRecorder.stop();
          cleanup();
          hideAllOverlays();
        };

        finishBtn.onclick = function () {
          if (!activeRecorder) return;
          var rec = activeRecorder;
          cleanup();
          hideAllOverlays();
          waitStatus.textContent = 'Transcribing…';
          waitSub.textContent = '';
          waitOverlay.hidden = false;
          rec.stop().then(function (blob) {
            return Voice.transcribe(blob);
          }).then(function (text) {
            if (!text) throw new Error('empty_transcript');
            waitSub.textContent = '"' + text + '"';
            waitStatus.textContent = mode === 'execute' ? 'Sending instruction…' : 'Awaiting response from CC…';
            return Voice.sendMessage(text, mode).then(function (created) {
              if (mode === 'execute') {
                setTimeout(function () {
                  hideAllOverlays();
                }, 1200);
                waitStatus.textContent = 'Got it — working on it.';
                return null;
              }
              return Voice.pollMessage(created.id);
            });
          }).then(function (row) {
            if (!row) return;
            if (row.status === 'error') {
              resultStatus.textContent = 'Something went wrong';
              resultText.textContent = row.error_message || 'Unknown error.';
              hideAllOverlays();
              resultOverlay.hidden = false;
              return;
            }
            resultStatus.textContent = 'CC replied';
            resultText.textContent = row.reply_text || '';
            hideAllOverlays();
            resultOverlay.hidden = false;
            Voice.speak(row.reply_text || '').catch(function () {});
          }).catch(function (err) {
            hideAllOverlays();
            resultStatus.textContent = 'Something went wrong';
            resultText.textContent = (err && err.message) || 'Please try again.';
            resultOverlay.hidden = false;
          });
        };
      }

      askBtn.addEventListener('click', function () { startFlow('respond'); });
      executeBtn.addEventListener('click', function () { startFlow('execute'); });
      resultDoneBtn.addEventListener('click', hideAllOverlays);

      function renderHistory(rows) {
        historyList.innerHTML = '';
        if (!rows.length) {
          historyList.innerHTML = '<p style="color:var(--ink-faint);text-align:center;margin-top:20px;">No messages yet.</p>';
          return;
        }
        rows.forEach(function (row) {
          var item = document.createElement('div');
          item.className = 'v-history-item' + (row.mode === 'execute' ? ' v-hi-execute' : '');
          var modeEl = document.createElement('div');
          modeEl.className = 'v-hi-mode';
          modeEl.textContent = row.mode === 'execute' ? 'Execute · ' + row.status : 'Ask · ' + row.status;
          var youEl = document.createElement('div');
          youEl.className = 'v-hi-you';
          youEl.textContent = row.transcript;
          item.appendChild(modeEl);
          item.appendChild(youEl);
          if (row.reply_text) {
            var replyEl = document.createElement('div');
            replyEl.className = 'v-hi-reply';
            replyEl.textContent = row.reply_text;
            item.appendChild(replyEl);
            var playBtn = document.createElement('button');
            playBtn.className = 'v-hi-play';
            playBtn.type = 'button';
            playBtn.textContent = '▶ Play';
            playBtn.addEventListener('click', function () { Voice.speak(row.reply_text).catch(function () {}); });
            item.appendChild(playBtn);
          }
          if (row.error_message) {
            var errEl = document.createElement('div');
            errEl.className = 'v-hi-reply';
            errEl.style.color = 'var(--error)';
            errEl.textContent = row.error_message;
            item.appendChild(errEl);
          }
          var timeEl = document.createElement('div');
          timeEl.className = 'v-hi-time';
          timeEl.textContent = new Date(row.created_at).toLocaleString();
          item.appendChild(timeEl);
          historyList.appendChild(item);
        });
      }

      historyBtn.addEventListener('click', function () {
        historyPanel.hidden = false;
        Voice.listMessages(40).then(renderHistory).catch(function () {
          historyList.innerHTML = '<p style="color:var(--ink-faint);text-align:center;margin-top:20px;">Could not load history.</p>';
        });
      });
      historyCloseBtn.addEventListener('click', function () { historyPanel.hidden = true; });
    })();
  </script>
</body>
</html>
