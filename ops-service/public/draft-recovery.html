<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Content Studio draft recovery</title>
  <style>
    body{margin:0;background:#07100c;color:#ecf5ed;font:16px/1.5 system-ui,sans-serif}main{max-width:850px;margin:6vh auto;padding:24px}h1{font:2rem Georgia,serif;color:#e7d4a1}article{border:1px solid #315442;border-radius:10px;padding:20px;margin:20px 0;background:#0e1c15}button,a{background:#d5ba75;color:#07100c;border:0;border-radius:5px;padding:10px 14px;font:600 15px system-ui,sans-serif;cursor:pointer}a{display:inline-block;text-decoration:none}textarea{box-sizing:border-box;width:100%;min-height:220px;margin-top:12px;background:#06100b;color:#f1f5ee;border:1px solid #315442;padding:12px;font:15px/1.5 system-ui,sans-serif}small{color:#acc2b0} .warn{color:#f1c58d}
  </style>
</head>
<body><main>
  <h1>Recover local Content Studio drafts</h1>
  <p>This page reads only drafts stored in <strong>this browser on this device</strong>. It does not save, delete, or send anything. Open it on the laptop where you wrote the missing text. Copy or download any draft before returning to the editor.</p>
  <p><button id="download" type="button">Download all recovery data</button> <a href="/#content-ops">Back to Content Studio</a></p>
  <p id="status" role="status"></p>
  <div id="drafts"></div>
</main>
<script>
(function(){
  'use strict';
  var keys=['rm-content-piece-drafts-v1','rm-content-piece-recovery-v1'];
  var all={};
  var target=document.getElementById('drafts');
  var count=0;
  keys.forEach(function(key){
    try{all[key]=JSON.parse(localStorage.getItem(key)||'{}')||{};}
    catch(error){all[key]={_readError:String(error)};}
    Object.keys(all[key]).forEach(function(id){
      var entries=Array.isArray(all[key][id])?all[key][id]:[all[key][id]];
      entries.forEach(function(entry){
        var piece=entry&&entry.piece;
        if(!piece)return;
        count++;
        var article=document.createElement('article');
        var heading=document.createElement('h2');
        heading.textContent=(piece.title||'Untitled')+(typeof piece.seq==='number'?' (#'+String(piece.seq).padStart(3,'0')+')':'');
        article.appendChild(heading);
        var info=document.createElement('small');
        info.textContent='Local '+(key===keys[0]?'working draft':'protected recovery copy')+' · '+(piece.updatedAt||'unknown time')+' · '+id;
        article.appendChild(info);
        var text=document.createElement('textarea');
        text.readOnly=true;
        var container=document.createElement('div');
        container.innerHTML=piece.notesHtml||'';
        text.value=container.innerText||container.textContent||'';
        article.appendChild(text);
        var copy=document.createElement('button');
        copy.type='button';copy.textContent='Copy text';
        copy.addEventListener('click',function(){navigator.clipboard.writeText(text.value).then(function(){copy.textContent='Copied';},function(){text.select();document.execCommand('copy');copy.textContent='Copied';});});
        article.appendChild(copy);
        target.appendChild(article);
      });
    });
  });
  document.getElementById('status').textContent=count?count+' local draft copy/copies found.':'No Content Studio drafts found in this browser. Check the same browser profile used while writing.';
  document.getElementById('download').addEventListener('click',function(){
    var blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);var link=document.createElement('a');
    link.href=url;link.download='content-studio-draft-recovery-'+new Date().toISOString().slice(0,10)+'.json';
    link.click();setTimeout(function(){URL.revokeObjectURL(url);},30000);
  });
})();
</script>
</body></html>
